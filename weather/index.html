<head>
  <meta charset="utf-8" />

  <title>Weather</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b10;
      --panel: #111821;
      --panel-soft: #162130;
      --text: #edf4ff;
      --muted: #9fb0c4;
      --grid: #27364a;
      --axis: #6f8197;
      --observed: #63d6c5;
      --forecast: #ffcf66;
      --now: #4aa3ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080b10;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 42px 0 36px;
    }

    .chart-wrap {
      padding: 0;
      overflow-x: auto;
    }

    .chart {
      display: block;
      min-width: 860px;
      width: 100%;
      height: auto;
    }

    .grid {
      stroke: var(--grid);
      stroke-width: 1;
    }

    .vertical {
      opacity: 0.58;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 1.4;
    }

    .axis-label {
      fill: var(--muted);
      font-size: 17px;
    }

    .line {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 4.5;
    }

    .observed {
      stroke: var(--observed);
    }

    .forecast {
      stroke: var(--forecast);
    }

    .now {
      stroke: var(--now);
      stroke-dasharray: 8 8;
      stroke-width: 2.5;
    }

    .swatch {
      width: 22px;
      height: 4px;
      border-radius: 999px;
      background: var(--observed);
    }

    .swatch.forecast {
      background: var(--forecast);
    }

    footer {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 18px;
    }

    @media (max-width: 780px) {
      main {
        width: min(100vw - 20px, 1180px);
        padding-top: 24px;
      }

    }
  </style>
</head>
